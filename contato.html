<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - ALPHA Kits</title>
    <link rel="stylesheet" href="styles/contato.css">
    <link rel="shortcut icon" href="favicon/favicon.png" type="image/x-icon">
</head>
<body>

<header>
    <h1>ALPHA Kits</h1>
    <nav>
        <a href="index.html">Inicial</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html" class="active">Contato</a>
    </nav>
</header>

<section class="container">
    <h1>Contato</h1>

    <form id="form">
        <input type="text" placeholder="Nome" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Mensagem" required></textarea>
        <button type="submit">Enviar</button>
    </form>

</section>
<footer>
    <p>ALPHA Kits Corporativos</p>
    <p><a href="https://github.com/matheusrsdeveloper">Matheus R.</a> | Isaqui N. | Pedro C.</p>
</footer>


<!-- JS SOMENTE DO FORMULÁRIO -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('form');

    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            alert('Mensagem enviada com sucesso!');

            form.reset(); // limpa o formulário depois de enviar
        });
    }
});
</script>

</body>
</html>
